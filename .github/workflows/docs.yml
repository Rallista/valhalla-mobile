name: Deploy Docs

on:
  push:
    branches:
      - main

jobs:
  dokka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Dokka HTML docs
        # This runner has no NDK or vcpkg, so skip the native builds preBuild would trigger.
        run: ./gradlew dokkaGenerateHtml -x buildValhallaFor-arm64-v8a -x buildValhallaFor-armeabi-v7a -x buildValhallaFor-x86_64 -x buildValhallaFor-x86
        working-directory: android

      - name: Deploy to GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./android/valhalla/build/docs
